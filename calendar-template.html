<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palmeiras Calendar Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e27;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calendar-container {
            width: 100%;
            max-width: 540px;
            aspect-ratio: 1080 / 1350;
            background: linear-gradient(to bottom, #065f2e 0%, #054d26 50%, #032d18 100%);
            background-image: 
                linear-gradient(135deg, rgba(5, 46, 22, 0.5) 0%, rgba(5, 46, 22, 0) 100%),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.015) 2px,
                    rgba(255, 255, 255, 0.015) 4px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.01) 2px,
                    rgba(255, 255, 255, 0.01) 4px
                );
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Watermark Background */
        .watermark {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.04;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .watermark-text {
            text-align: center;
            color: white;
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .watermark-main {
            font-size: 120px;
            letter-spacing: 2px;
        }

        .watermark-sub {
            font-size: 90px;
            letter-spacing: 2px;
        }

        /* Main Content */
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 30px 32px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 32px;
            gap: 16px;
        }

        .logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(to bottom right, #ffffff, #f0fdf4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 2px solid #dcfce7;
            flex-shrink: 0;
        }

        .logo-text {
            color: #065f2e;
            font-weight: bold;
            font-size: 24px;
            font-family: 'Playfair Display', serif;
        }

        .title-area {
            flex: 1;
            text-align: center;
            padding: 0 16px;
        }

        .month {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            font-weight: 700;
            color: white;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            line-height: 1;
        }

        .year {
            font-size: 20px;
            color: #a7f3d0;
            font-weight: 300;
            letter-spacing: 0.1em;
        }

        .instagram-handle {
            text-align: right;
            flex-shrink: 0;
        }

        .handle-main {
            font-size: 11px;
            color: #bbf7d0;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .handle-sub {
            font-size: 10px;
            color: #86efac;
            font-weight: 300;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #6ee7b7, transparent);
            opacity: 0.3;
            margin-bottom: 24px;
        }

        /* Day Labels */
        .day-labels {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .day-label {
            text-align: center;
            color: #bbf7d0;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            padding: 8px 0;
            font-family: 'Lato', sans-serif;
        }

        /* Calendar Grid */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            flex: 1;
            margin-bottom: 24px;
        }

        .calendar-day {
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .calendar-day:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transform: scale(1.05);
        }

        .calendar-day.empty {
            background: transparent;
            border: none;
            cursor: default;
        }

        .calendar-day.empty:hover {
            background: transparent;
            box-shadow: none;
            transform: none;
        }

        .calendar-day.match {
            background: linear-gradient(to bottom right, #fcd34d, #fbbf24);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border: none;
        }

        .calendar-day.match:hover {
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .day-number {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            font-family: 'Lato', sans-serif;
        }

        .calendar-day .day-number {
            color: white;
        }

        .calendar-day.match .day-number {
            color: #065f2e;
        }

        .match-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .team-logo {
            width: 24px;
            height: 24px;
            background: #065f2e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 9px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .vs-indicator {
            color: #065f2e;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .footer-text {
            color: #86efac;
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.1em;
            font-family: 'Lato', sans-serif;
        }

        .footer-season {
            color: #6ee7b7;
            font-size: 10px;
            margin-top: 4px;
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .content {
                padding: 24px 20px;
            }

            .header {
                margin-bottom: 24px;
            }

            .logo {
                width: 48px;
                height: 48px;
            }

            .logo-text {
                font-size: 20px;
            }

            .month {
                font-size: 40px;
            }

            .year {
                font-size: 16px;
            }

            .handle-main {
                font-size: 10px;
            }

            .handle-sub {
                font-size: 9px;
            }

            .day-label {
                font-size: 10px;
            }

            .calendar-grid {
                gap: 6px;
                margin-bottom: 20px;
            }

            .calendar-day {
                padding: 6px;
                border-radius: 10px;
            }

            .day-number {
                font-size: 10px;
            }

            .team-logo {
                width: 20px;
                height: 20px;
                font-size: 8px;
            }

            .vs-indicator {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <!-- Watermark -->
        <div class="watermark">
            <div class="watermark-text">
                <div class="watermark-main">@meupalestra</div>
                <div class="watermark-sub">.1914</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Header -->
            <div class="header">
                <div class="logo">
                    <div class="logo-text">P</div>
                </div>
                <div class="title-area">
                    <div class="month" id="monthDisplay">ABRIL</div>
                    <div class="year" id="yearDisplay">2026</div>
                </div>
                <div class="instagram-handle">
                    <div class="handle-main">@meupalestra</div>
                    <div class="handle-sub">.1914</div>
                </div>
            </div>

            <!-- Divider -->
            <div class="divider"></div>

            <!-- Day Labels -->
            <div class="day-labels">
                <div class="day-label">DOM</div>
                <div class="day-label">SEG</div>
                <div class="day-label">TER</div>
                <div class="day-label">QUA</div>
                <div class="day-label">QUI</div>
                <div class="day-label">SEX</div>
                <div class="day-label">SÁB</div>
            </div>

            <!-- Calendar Grid -->
            <div class="calendar-grid" id="calendarGrid"></div>

            <!-- Footer -->
            <div class="footer">
                <div class="footer-text">CALENDÁRIO OFICIAL • PALMEIRAS</div>
                <div class="footer-season">Temporada 2026</div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const config = {
            daysInMonth: 30,
            firstDayOfWeek: 2, // 0 = Sunday, 1 = Monday, 2 = Tuesday, etc.
            matches: [
                { day: 5, homeTeam: 'Palmeiras', awayTeam: 'Corinthians' },
                { day: 12, homeTeam: 'Palmeiras', awayTeam: 'São Paulo' },
                { day: 19, homeTeam: 'Flamengo', awayTeam: 'Palmeiras' },
            ]
        };

        function isMatchDay(day) {
            return config.matches.some(m => m.day === day);
        }

        function getMatch(day) {
            return config.matches.find(m => m.day === day);
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // Add empty cells for days before the month starts
            for (let i = 0; i < config.firstDayOfWeek; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-day empty';
                grid.appendChild(emptyCell);
            }

            // Add days of the month
            for (let day = 1; day <= config.daysInMonth; day++) {
                const dayCell = document.createElement('div');
                const isMatch = isMatchDay(day);
                const match = getMatch(day);

                dayCell.className = `calendar-day ${isMatch ? 'match' : ''}`;

                let html = `<div class="day-number">${day}</div>`;

                if (isMatch && match) {
                    html += `
                        <div class="match-content">
                            <div class="team-logo">H</div>
                            <div class="vs-indicator">×</div>
                            <div class="team-logo">A</div>
                        </div>
                    `;
                }

                dayCell.innerHTML = html;
                grid.appendChild(dayCell);
            }
        }

        // Initialize
        renderCalendar();

        // Allow easy customization via JavaScript
        window.updateCalendar = function(month, year, daysInMonth, firstDayOfWeek, matches) {
            if (month) document.getElementById('monthDisplay').textContent = month;
            if (year) document.getElementById('yearDisplay').textContent = year;
            if (daysInMonth) config.daysInMonth = daysInMonth;
            if (firstDayOfWeek !== undefined) config.firstDayOfWeek = firstDayOfWeek;
            if (matches) config.matches = matches;
            renderCalendar();
        };

        // Example: Update to May 2026
        // window.updateCalendar('MAIO', '2026', 31, 4, [
        //     { day: 3, homeTeam: 'Palmeiras', awayTeam: 'Flamengo' },
        //     { day: 10, homeTeam: 'São Paulo', awayTeam: 'Palmeiras' },
        // ]);
    </script>
</body>
</html>
